<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CF monogram">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79b8ff"/>
      <stop offset="0.55" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#tile)"/>

  <!-- Monogram drawn as geometry, not text, so it renders identically everywhere.
       The wrapper centres the combined C+F bounding box on the tile. -->
  <g transform="translate(32 32) scale(0.95) translate(-33.8 -32)">
  <g fill="none" stroke="#0b1220" stroke-width="7" stroke-linecap="round">
    <!-- C: an open arc, gap facing right -->
    <path d="M32.6 22.6 A 11.4 11.4 0 1 0 32.6 41.4"/>
  </g>
  <g fill="#0b1220">
    <!-- F: stem + two bars -->
    <rect x="40.5" y="19" width="6.6" height="26" rx="3.3"/>
    <rect x="40.5" y="19" width="15.5" height="6.6" rx="3.3"/>
    <rect x="40.5" y="28.7" width="12" height="6.3" rx="3.15"/>
  </g>
  </g>
</svg>
